<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momen Kita — Sahrul ♥ Dara</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#FFF6F3; --card:#FFFCFA; --ink:#43182B; --ink-soft:#8A5A6C;
  --rose:#E75A7C; --rose-deep:#C73E63; --blush:#FFDCE3; --blush-soft:#FFEFF2;
  --gold:#D9A441; --line:#F3D3DA;
  --shadow:0 14px 34px -18px rgba(67,24,43,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:var(--bg);min-height:100svh;overflow-x:hidden}
::selection{background:var(--rose);color:#fff}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 560px at 88% -10%,#FFE1E9 0%,transparent 60%),
  radial-gradient(900px 520px at -10% 30%,#FFEFD8 0%,transparent 55%),
  radial-gradient(760px 760px at 108% 85%,#FFD9E2 0%,transparent 60%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(231,90,124,.10) 1px,transparent 1.6px);background-size:26px 26px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
.petal{position:fixed;top:-6vh;z-index:1;pointer-events:none;animation:jatuh linear infinite}
@keyframes jatuh{to{transform:translate(var(--sway,0),112vh) rotate(560deg)}}
.btn{font:inherit;font-weight:700;border:none;cursor:pointer;border-radius:999px;transition:.25s;text-decoration:none;display:inline-block}
.btn-primary{background:linear-gradient(120deg,var(--rose),var(--rose-deep));color:#fff;padding:12px 24px;box-shadow:0 10px 20px -10px rgba(199,62,99,.6)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink);padding:9px 16px}
.btn-ghost:hover{border-color:var(--rose);background:var(--blush-soft)}
.btn-ghost.small{padding:7px 14px;font-size:.82rem}
.masthead{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;justify-content:space-between;padding-top:54px;padding-bottom:26px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05}
h1 em{font-style:italic;color:var(--rose-deep)}
h1 .hh{display:inline-block;color:var(--rose)}
.pair{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--rose-deep);margin-top:6px}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
.m-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.datecard{background:var(--card);border:1px solid var(--line);padding:16px 22px;transform:rotate(2deg);box-shadow:var(--shadow);text-align:center;position:relative;border-radius:4px;max-width:280px}
.datecard b{font-family:'Fraunces',serif;font-size:1.05rem;display:block}
.datecard small{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--gold)}
.tape{position:absolute;top:-13px;left:50%;width:110px;height:28px;transform:translateX(-50%) rotate(-2deg);background:rgba(217,164,65,.4);border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6)}
.t2{left:24px;transform:rotate(-6deg);width:80px;background:rgba(231,90,124,.30)}
.conn{background:var(--card);border:2px dashed var(--rose);border-radius:16px;padding:24px;text-align:center;margin-bottom:22px;box-shadow:var(--shadow)}
.conn p{color:var(--ink-soft);margin-bottom:14px}
.composer{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:26px}
.c-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.chips-author{display:flex;gap:8px;flex-wrap:wrap}
.chip-author{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.chip-author.on{border-color:var(--rose);background:var(--blush-soft);box-shadow:0 0 0 4px var(--blush)}
.ava{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.8rem;font-weight:700;font-style:normal;flex:none}
.ava.a1{background:linear-gradient(135deg,var(--rose),var(--rose-deep))}
.ava.a2{background:linear-gradient(135deg,var(--gold),#B07E22)}
.c-greet{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--ink-soft)}
#cerita{width:100%;border:none;resize:none;font:inherit;font-size:1.05rem;line-height:1.6;min-height:64px;background:transparent;color:var(--ink)}
#cerita:focus{outline:none}
#cerita::placeholder{font-family:'Caveat',cursive;font-size:1.45rem;color:#C99AAB}
.prev{margin-top:12px;position:relative;display:inline-block}
.prev img{max-height:200px;border-radius:10px;border:1px solid var(--line)}
.prev-x{position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;border:none;background:var(--ink);color:#fff;cursor:pointer}
.c-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:2px dashed var(--line);margin-top:16px;padding-top:16px}
.c-actions .btn-primary{margin:0 0 0 auto}
.otd{background:#FFF6E3;border:2px dashed var(--gold);border-radius:12px;padding:14px 18px;margin-bottom:22px;font-size:.92rem;transform:rotate(-.4deg);line-height:1.5}
.otd b{color:#8a6210}
.feedbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chips button{font:inherit;font-weight:600;font-size:.85rem;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer}
.chips button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.feed{columns:1;column-gap:22px;padding-bottom:30px}
@media(min-width:700px){.feed{columns:2}}
@media(min-width:1080px){.feed{columns:3}}
.card{break-inside:avoid;margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:14px 14px 12px;position:relative;transform:rotate(var(--tilt,0deg));transition:.35s}
.card:hover{transform:rotate(0) translateY(-6px)}
.card .tape{width:84px;height:24px;top:-11px}
.card:nth-child(even) .tape{transform:translateX(-50%) rotate(3deg);background:rgba(231,90,124,.28)}
.media{margin:6px 0 10px;border-radius:3px;overflow:hidden;background:#F6E9E4}
.media img{width:100%;display:block;cursor:zoom-in}
.media .play{width:100%;padding:46px 10px;font:inherit;font-weight:700;border:none;cursor:pointer;background:linear-gradient(160deg,#F7B267,#C73E63);color:#fff}
.media iframe.vid{width:100%;height:260px;border:none;display:block}
.caption{font-family:'Caveat',cursive;font-size:1.4rem;line-height:1.35;padding:2px 4px}
.card.note{background:linear-gradient(160deg,var(--blush-soft),var(--blush));padding:22px 20px 14px}
.card.note .caption{font-size:1.65rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.75rem;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.who{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink)}
.who .ava{width:22px;height:22px;font-size:.65rem}
.rel{margin-left:auto;background:var(--blush);color:var(--rose-deep);font-weight:700;padding:2px 10px;border-radius:999px;font-size:.68rem}
.acts{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px}
.like{font:inherit;border:none;background:none;cursor:pointer;color:#C9A0AC;font-size:1.05rem;display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px}
.like b{font-size:.8rem;color:var(--ink-soft)}
.like.on{color:var(--rose-deep)}
.del{font:inherit;font-size:.72rem;border:none;background:none;color:#C9A0AC;cursor:pointer;opacity:0;padding:4px 8px;border-radius:8px}
.card:hover .del{opacity:1}
@media(hover:none){.del{opacity:1}}
.kosong{column-span:all;text-align:center;padding:60px 20px;color:var(--ink-soft)}
.kosong .big{font-size:3rem;display:block;margin-bottom:12px}
.kosong p{font-family:'Caveat',cursive;font-size:1.6rem}
.lb{position:fixed;inset:0;background:rgba(42,15,27,.86);z-index:80;display:grid;place-items:center;cursor:zoom-out;padding:20px}
.lb img{max-width:94vw;max-height:88vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ink);color:#FFE9EF;padding:12px 22px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:90;transition:.35s}
#toast.show{transform:translate(-50%,0)}
.foot{text-align:center;padding:30px 20px 60px;color:var(--ink-soft);font-size:.8rem}
.sig{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--rose-deep)}
</style>
</head>
<body>
<script> if (!localStorage.getItem("sd_login")) location.replace("index.html"); </script>
<div class="sky"></div><div id="petals"></div>

<main>
  <header class="masthead wrap">
    <div>
      <p class="eyebrow">✦ buku kenangan berdua ✦</p>
      <h1>Rumah <em>Kita</em> <span class="hh">♥</span></h1>
      <p class="pair" id="mNama"></p>
    </div>
    <div class="m-right">
      <div class="datecard"><span class="tape t2"></span><b id="hariIni"></b><small id="hariKita"></small></div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-ghost small" href="home.html">← Rumah</a>
        <button id="keluar" class="btn btn-ghost small" type="button">🚪 keluar</button>
      </div>
    </div>
  </header>

  <section id="conn" class="conn wrap">
    <p id="connMsg">Semua kenangan kita tersimpan aman di Google Drive, cuma kita yang bisa lihat.</p>
    <button id="btnSambung" class="btn btn-primary">🔗 Sambungkan Google Drive</button>
  </section>

  <!-- BARIS TOMBOL BARU: ruang bersama + ruang privat masing-masing -->
  <div class="feedbar wrap">
    <div class="chips" id="tabs">
      <button data-t="kita" class="on" type="button">💞 Momen Kita</button>
      <button data-t="Sahrul" type="button">🤫 Ruang Sahrul</button>
      <button data-t="Dara" type="button">🤫 Ruang Dara</button>
    </div>
  </div>

  <section class="composer wrap" id="composer">
    <div class="c-head">
      <div class="chips-author">
        <button class="chip-author on" data-a="1" type="button"><i class="ava a1" id="avaAku">S</i><span id="cNamaAku"></span></button>
        <button class="chip-author" data-a="2" type="button"><i class="ava a2" id="avaKamu">D</i><span id="cNamaKamu"></span></button>
      </div>
      <span class="c-greet" id="greet"></span>
    </div>
    <textarea id="cerita" rows="2" placeholder="Ceritakan momen kalian hari ini…"></textarea>
    <div id="prev" class="prev" hidden></div>
    <div class="c-actions">
      <input type="file" id="file" hidden>
      <button class="btn btn-ghost" id="btnFoto" type="button">📷 Foto</button>
      <button class="btn btn-ghost" id="btnVideo" type="button">🎬 Video</button>
      <button class="btn btn-primary" id="btnSimpan" type="button">Simpan Kenangan ♥</button>
    </div>
  </section>

  <div class="wrap" id="otdWrap"><div id="otd" class="otd" hidden></div></div>
  <div class="feedbar wrap" id="filterbar">
    <div class="chips" id="chips">
      <button data-f="semua" class="on" type="button">Semua</button>
      <button data-f="text" type="button">✎ Catatan</button>
      <button data-f="foto" type="button">📷 Foto</button>
      <button data-f="video" type="button">🎬 Video</button>
    </div>
  </div>
  <section id="feed" class="feed wrap"></section>
  <footer class="foot wrap"><p class="sig">dibuat dengan ♥, hanya untuk kita berdua</p></footer>
</main>

<div id="lightbox" class="lb" hidden><img id="lbImg" alt="Foto kenangan"></div>
<div id="toast"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/drive.js"></script>
<script>
const $ = s => document.querySelector(s);
const namaSahrul = (CONFIG.namaKamu || "Sahrul").split(" ")[0];
const namaDara   = (CONFIG.namaDia  || "Dara").split(" ")[0];
let list = [], filter = "semua", author = namaSahrul, pending = null, folderId = null;
let view = "kita", mePerson = null;
let likedIds = new Set(JSON.parse(localStorage.getItem("sd_likes") || "[]"));

function isiHeader(){
  $("#mNama").textContent = namaSahrul + " ♥ " + namaDara;
  $("#cNamaAku").textContent = namaSahrul;
  $("#cNamaKamu").textContent = namaDara;
  $("#avaAku").textContent = namaSahrul[0].toUpperCase();
  $("#avaKamu").textContent = namaDara[0].toUpperCase();
  const now = new Date();
  $("#hariIni").textContent = now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const hariKe = Math.max(1, Math.floor((Date.now()-new Date(CONFIG.tanggalJadian))/864e5)+1);
  $("#hariKita").textContent = "✦ hari ke-" + hariKe.toLocaleString("id-ID") + " bersama ✦";
  const h = now.getHours();
  $("#greet").textContent = "selamat " + (h<11?"pagi":h<15?"siang":h<19?"sore":"malam") + " ☕";
}

/* ---- sambung Drive ---- */
$("#btnSambung").addEventListener("click", () => {
  $("#connMsg").textContent = "Menyambungkan…";
  sambungDrive(async () => {
    try {
      mePerson = CONFIG.petaEmail[await emailSaya()] || null;
      folderId = await dapatkanFolder();
      await seedJikaKosong();
      $("#conn").hidden = true;
      await muat();
      toast("Tersambung dengan rumah Drive kita 🤍");
    } catch(e){ $("#connMsg").textContent = "Yah, ada kesalahan: " + e.message; }
  });
});

const SEED = [
  {oleh: namaSahrul, hari: 0, caption: "Rumah bukan cuma tempat, tapi kamu. Selama ada kamu, Sulawesi dan Aceh terasa seperti satu atap. ♥"},
  {oleh: namaDara,  hari: 1, caption: "Kamu nggak pernah sendiri, sayang. Aku tuh selalu ada — di setiap doa, di setiap pesan, di setiap rindu yang kamu kirim. Aku sayang kamu banget."},
  {oleh: namaSahrul, hari: 2, caption: "Jarak cuma angka di peta. Di hati, kita selalu pulang ke orang yang sama. Tunggu aku, ya. ♥"}
];
async function seedJikaKosong(){
  const ada = await daftarMomen(folderId);
  if (ada.length) return;
  for (const s of SEED){
    const t = new Date(Date.now() - s.hari*864e5);
    await uploadMomen(new Blob([s.caption],{type:"text/plain"}), s.caption,
      "Catatan — " + t.toISOString() + ".txt", s.oleh, t.toISOString());
  }
}

async function muat(){ list = await daftarMomen(folderId); render(); renderOTD(); }

function relatif(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m<1) return "baru saja"; if(m<60) return m+" mnt lalu";
  const h = Math.floor(m/60); if(h<24) return h+" jam lalu";
  const d = Math.floor(h/24); if(d===1) return "kemarin";
  if(d<7) return d+" hari lalu"; return "";
}

function kartu(p){
  const t = new Date(p.meta.waktu || p.createdTime);
  const tgl = t.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  const jam = t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  const rel = relatif(t.getTime());
  const nama = p.meta.oleh || namaSahrul;
  const kelasAva = nama === namaSahrul ? "a1" : "a2";
  let media = "";
  if (p.mimeType.startsWith("image/"))
    media = `<figure class="media"><img src="https://drive.google.com/thumbnail?id=${p.id}&sz=w1200" alt="Foto kenangan" loading="lazy"></figure>`;
  else if (p.mimeType.startsWith("video/"))
    media = `<figure class="media"><button class="play" data-id="${p.id}" type="button">🎬 Putar video</button></figure>`;
  const cap = p.meta.caption ? `<p class="caption">${esc(p.meta.caption).replace(/\n/g,"<br>")}</p>` : "";
  const liked = likedIds.has(p.id);
  return `<article class="card ${p.mimeType.includes("text")?"note":""}" data-id="${p.id}" style="--tilt:${(Math.random()*3-1.5).toFixed(1)}deg">
    <span class="tape"></span>${media}${cap}
    <div class="meta">
      <span class="who"><i class="ava ${kelasAva}">${esc((nama[0]||"A").toUpperCase())}</i>${esc(nama)}</span>
      <time>${tgl} · ${jam}</time>
      ${rel?`<span class="rel">${rel}</span>`:""}
    </div>
    <div class="acts">
      <button class="like ${liked?"on":""}" type="button">♥ <b>${p.meta.likes||0}</b></button>
      <button class="del" type="button">hapus</button>
    </div>
  </article>`;
}

function render(){
  let arr = [...list].sort((a,b)=> new Date(b.meta.waktu||b.createdTime) - new Date(a.meta.waktu||a.createdTime));
  if (filter==="text")  arr = arr.filter(p=>p.mimeType.includes("text"));
  if (filter==="foto")  arr = arr.filter(p=>p.mimeType.startsWith("image/"));
  if (filter==="video") arr = arr.filter(p=>p.mimeType.startsWith("video/"));
  const feed = $("#feed");
  if (!arr.length){ feed.innerHTML = `<div class="kosong"><span class="big">♥</span><p>Belum ada kenangan di sini — tulis yang pertama yuk ✍️</p></div>`; return; }
  feed.innerHTML = arr.map(kartu).join("");
}

function renderOTD(){
  const now = new Date(), otd = $("#otd"), j = new Date(CONFIG.tanggalJadian);
  if (now.getDate()===j.getDate() && now.getMonth()===j.getMonth()){
    otd.hidden = false;
    otd.innerHTML = `🎂 <b>Hari ini hari jadian kita!</b> ${now.getFullYear()-j.getFullYear()} tahun sudah kita berjuang melawan jarak — dan lihat, kita masih sama-sama di sini. Aku sayang kamu banget. ♥`;
    return;
  }
  const m = list.filter(p=>{ const d=new Date(p.meta.waktu||p.createdTime);
    return d.getDate()===now.getDate() && d.getMonth()===now.getMonth() && d.getFullYear()<now.getFullYear(); });
  if (!m.length){ otd.hidden = true; return; }
  const thn = now.getFullYear() - new Date(m[0].meta.waktu||m[0].createdTime).getFullYear();
  otd.hidden = false;
  otd.innerHTML = `✨ <b>Hari ini, ${thn} tahun lalu…</b> “${esc((m[0].meta.caption||"").slice(0,80))}${(m[0].meta.caption||"").length>80?"…":""}”`;
}

/* ============ RUANG PRIVAT ============ */
async function bukaPrivat(nama){
  const feed = $("#feed");
  if (!folderId){
    $("#composer").hidden = true;
    feed.innerHTML = `<div class="kosong"><span class="big">🔗</span><p>Sambungkan Google Drive dulu untuk membuka ruang ini.</p></div>`;
    return;
  }
  if (mePerson !== nama){
    $("#composer").hidden = true;
    feed.innerHTML = `<div class="kosong"><span class="big">🔒</span><p>Ini ruang rahasia ${nama} — cuma dia yang boleh masuk. Dan itu okay, sayang. Setiap orang butuh taman kecilnya sendiri. ♥</p></div>`;
    return;
  }
  $("#composer").hidden = false;
  $("#cerita").placeholder = `Tulis rahasiamu, ${nama}… hanya kamu yang bisa baca 🤫`;
  feed.innerHTML = `<div class="kosong"><span class="big">⏳</span><p>Membuka ruang rahasiamu…</p></div>`;
  try {
    const fid = await dapatkanFolderPrivat(nama);
    renderPrivat(await daftarPrivat(fid));
  } catch(e){
    feed.innerHTML = `<div class="kosong"><span class="big">🥺</span><p>Gagal membuka: ${esc(e.message)}</p></div>`;
  }
}

function renderPrivat(arr){
  const feed = $("#feed");
  if (!arr.length){
    feed.innerHTML = `<div class="kosong"><span class="big">🤫</span><p>Ini ruang rahasiamu. Keluhkan, rindukan, syukuri — semua aman di sini, hanya untukmu. ♥</p></div>`;
    return;
  }
  feed.innerHTML = arr.map(p => {
    const t = new Date(p.meta.waktu || p.createdTime);
    const tgl = t.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const jam = t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    return `<article class="card note" data-id="${p.id}" style="--tilt:${(Math.random()*3-1.5).toFixed(1)}deg">
      <span class="tape"></span>
      <p class="caption">${esc(p.meta.caption).replace(/\n/g,"<br>")}</p>
      <div class="meta"><span class="who">🤫 hanya kamu</span><time>${tgl} · ${jam}</time></div>
      <div class="acts"><span></span><button class="del" type="button" style="opacity:1">hapus</button></div>
    </article>`;
  }).join("");
}

/* ---- pindah ruang (tabs) ---- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  view = b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x===b));
  if (view === "kita"){
    $("#filterbar").hidden = false; $("#otdWrap").hidden = false; $("#composer").hidden = false;
    $("#cerita").placeholder = "Ceritakan momen kalian hari ini…";
    render(); renderOTD();
  } else {
    $("#filterbar").hidden = true; $("#otdWrap").hidden = true;
    bukaPrivat(view);
  }
});

/* ---- komposer ---- */
document.querySelectorAll(".chip-author").forEach(b=>b.addEventListener("click",()=>{
  author = b.dataset.a==="1" ? namaSahrul : namaDara;
  document.querySelectorAll(".chip-author").forEach(x=>x.classList.toggle("on",x===b));
}));
$("#btnFoto").addEventListener("click",()=>{ if(view!=="kita"){ toast("Ruang privat khusus tulisan ya 🤍"); return; } $("#file").accept="image/*"; $("#file").click(); });
$("#btnVideo").addEventListener("click",()=>{ if(view!=="kita"){ toast("Ruang privat khusus tulisan ya 🤍"); return; } $("#file").accept="video/*"; $("#file").click(); });
$("#file").addEventListener("change",()=>{
  const f = $("#file").files[0]; if(!f) return;
  pending = f;
  const pv = $("#prev"); pv.hidden = false;
  pv.innerHTML = (f.type.startsWith("image/") ? `<img src="${URL.createObjectURL(f)}">` : `🎬 <b>${esc(f.name)}</b> terpilih`)
    + ` <button class="prev-x" type="button">✕</button>`;
  pv.querySelector(".prev-x").onclick = ()=>{ pending=null; pv.hidden=true; pv.innerHTML=""; };
  $("#file").value = "";
});

$("#btnSimpan").addEventListener("click", async ()=>{
  if (!folderId){ toast("Sambungkan Google Drive dulu ya 🤍"); return; }
  const cap = $("#cerita").value.trim();
  const btn = $("#btnSimpan");

  /* simpan ke RUANG PRIVAT */
  if (view !== "kita"){
    if (!cap){ toast("Tulis dulu rahasiamu 😊"); return; }
    btn.disabled = true; btn.textContent = "Menyimpan…";
    try {
      await uploadPrivat(cap, mePerson);
      $("#cerita").value = "";
      toast("Tersimpan di ruang rahasiamu 🤫");
      bukaPrivat(view);
    } catch(e){ toast("Gagal menyimpan: "+e.message); }
    btn.disabled = false; btn.textContent = "Simpan Kenangan ♥";
    return;
  }

  /* simpan ke MOMEN KITA */
  if (!cap && !pending){ toast("Tulis cerita atau lampirkan foto/video dulu 😊"); return; }
  btn.disabled = true; btn.textContent = "Menyimpan…";
  try {
    const now = new Date().toISOString();
    if (pending) await uploadMomen(pending, cap, pending.name, author, now);
    else await uploadMomen(new Blob([cap],{type:"text/plain"}), cap, "Catatan — "+now+".txt", author, now);
    $("#cerita").value=""; pending=null; $("#prev").hidden=true; $("#prev").innerHTML="";
    toast("Tersimpan di buku kita ♥");
    await muat();
  } catch(e){ toast("Gagal menyimpan: "+e.message); }
  btn.disabled=false; btn.textContent="Simpan Kenangan ♥";
});

/* ---- interaksi kartu ---- */
$("#feed").addEventListener("click", async e=>{
  const card = e.target.closest(".card"); if(!card) return;
  const id = card.dataset.id;

  /* di ruang privat: hanya bisa hapus */
  if (view !== "kita"){
    if (e.target.closest(".del")){
      if (confirm("Hapus tulisan rahasia ini?")){
        try { await apiDrive(`files/${id}`, {method:"DELETE"}); toast("Rahasia dihapus 🤫"); bukaPrivat(view); }
        catch(err){ toast("Gagal hapus: "+err.message); }
      }
    }
    return;
  }

  const p = list.find(x=>x.id===id); if(!p) return;
  if (e.target.closest(".play")){
    const f = document.createElement("iframe");
    f.className="vid"; f.src=`https://drive.google.com/file/d/${p.id}/preview`; f.allow="autoplay";
    e.target.closest(".play").replaceWith(f); return;
  }
  if (e.target.closest(".like")){
    const on = !likedIds.has(p.id);
    if(on) likedIds.add(p.id); else likedIds.delete(p.id);
    localStorage.setItem("sd_likes", JSON.stringify([...likedIds]));
    p.meta.likes = Math.max(0,(p.meta.likes||0)+(on?1:-1));
    try{ await apiDrive(`files/${p.id}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({description: JSON.stringify(p.meta)})}); }catch(err){}
    e.target.closest(".like").classList.toggle("on",on);
    e.target.closest(".like").querySelector("b").textContent = p.meta.likes;
    return;
  }
  if (e.target.closest(".del")){
    if (confirm("Hapus kenangan ini?")){
      try{ await apiDrive(`files/${p.id}`, {method:"DELETE"}); toast("Kenangan dihapus"); await muat(); }catch(err){ toast("Gagal hapus: "+err.message); }
    } return;
  }
  const img = e.target.closest(".media img");
  if (img){ $("#lbImg").src = img.src.replace("sz=w1200","sz=w2000"); $("#lightbox").hidden = false; }
});
$("#lightbox").addEventListener("click", ()=>{ $("#lightbox").hidden = true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("#lightbox").hidden = true; });

$("#keluar").addEventListener("click", ()=>{ localStorage.removeItem("sd_login"); location.href="index.html"; });

(function(){
  const chars=["❀","♥","✿","♡","·"], cols=["#E75A7C","#D9A441","#F4A9B8","#C73E63"], w=$("#petals");
  for(let i=0;i<16;i++){
    const s=document.createElement("span"); s.className="petal"; s.textContent=chars[i%chars.length];
    s.style.cssText=`left:${Math.random()*100}vw;font-size:${10+Math.random()*14}px;color:${cols[i%cols.length]};opacity:${.25+Math.random()*.4};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s;--sway:${(Math.random()*16-8).toFixed(1)}vw`;
    w.appendChild(s);
  }
})();
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }
